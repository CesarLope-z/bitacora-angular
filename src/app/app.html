
<main class="main">
  <div class="content">
    <h1>Bitácora</h1>
    <p>Actividades que se realizaron durante las prácticas profesionales.</p>
  <div class="informacion">

    <!-- Datos del alumno -->
    <div class="bloque">
      <div class="campo">
        <label>Nombre:</label>
        <input type="text" name="nombre" [(ngModel)]="estudiante[0].nombre">
      </div>
      <div class="campo">
        <label>Carné:</label>
        <input type="text" name="carne" [(ngModel)]="estudiante[0].carne">
      </div>
      <div class="campo">
        <label>Carrera:</label>
        <input type="text" name="carrera" [(ngModel)]="estudiante[0].carrera">
      </div>
      <div class="campo">
        <label>Teléfono del estudiante:</label>
        <input type="tel" name="telefono" [(ngModel)]="estudiante[0].telefono">
      </div>
    </div>

    <!-- Datos de la coordinación -->
    <div class="bloque">
      <div class="campo">
        <label>Nombre del coordinador de UDB:</label>
        <input type="text" name="coord_udb" [(ngModel)]="estudiante[0].coordUDB">
      </div>
      <div class="campo">
        <label>Institución donde la realiza:</label>
        <input type="text" name="institucion" [(ngModel)]="estudiante[0].institucion">
      </div>
      <div class="campo">
        <label>Nombre de la coordinadora de institución:</label>
        <input type="text" name="coord_inst" [(ngModel)]="estudiante[0].coordInst">
      </div>
    </div>

    <!-- Fechas y horas -->
    <div class="bloque">
      <div class="campo">
        <label>Fecha de inicio:</label>
        <input type="date" name="fecha_inicio" [(ngModel)]="estudiante[0].fechaInicio">
      </div>
      <div class="campo">
        <label>Fecha de finalización:</label>
        <input type="date" name="fecha_fin" [(ngModel)]="estudiante[0].fechaFinalizacion">
      </div>
      <div class="campo">
        <label>Cantidad de horas:</label>
        <input type="number" name="horas" [(ngModel)]="estudiante[0].cantidadHoras">
      </div>
    </div>

  </div>
  <div class="acciones">
      <button type="button" (click)="exportWord()" class="btn btn-primary">Imprimir en un documento</button>
      <!-- <button type="button" class="btn btn-secondary">Cancelar</button> -->
    </div>

  <div class="bitacora">
  <h2>Registro de actividades</h2>

  <table border="1" cellpadding="5" cellspacing="0" class="tabla-actividades">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Nombre</th>
        <th>Descripción de la actividad</th>
        <th>Horas dedicadas</th>
        <th>Firma</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let act of actividad; let i = index">
      <td><input type="date" [(ngModel)]="act.fecha"></td>
      <td><input type="text" [(ngModel)]="act.nombre"></td>
      <td><textarea rows="2" [(ngModel)]="act.descripcion"></textarea></td>
      <td><input type="number" [(ngModel)]="act.horas"></td>
    </tr>
    </tbody>
  </table>
</div>
  </div>
</main>


<router-outlet />
